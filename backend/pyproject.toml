[project]
name = "inspection-agent"
version = "0.1.0"
description = "巡检多 agent 后端"
requires-python = "==3.11.10"
dependencies = [
    "PyMySQL",
    "PyYAML",
    "SQLAlchemy>=2",
    "PyJWT",
    "fastapi",
    "redis",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
